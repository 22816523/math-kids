<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>数学启蒙 · 加减法</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css?v=20260827_centered_title_alignment">
  <link rel="stylesheet" href="css/math.css?v=20260827_centered_title_alignment">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body>
  <!-- 护眼背景装饰 -->
  <div class="bg-decoration">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <div id="app">
    <div class="topbar">
      <div class="topbar-left">
        <a href="index.html" class="back-btn" aria-label="返回首页"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
        <span class="topbar-title"><span class="iconify" data-icon="fluent-emoji:plus" style="font-size: 26px; vertical-align: text-bottom;"></span> 加减法</span>
      </div>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-level="1">
        <span class="tab-icon"><span class="iconify" data-icon="fluent-emoji:keycap-10"></span></span>
        <span class="tab-label">10以内</span>
      </button>
      <button class="mode-tab" data-level="2">
        <span class="tab-icon"><span class="iconify" data-icon="fluent-emoji:abacus"></span></span>
        <span class="tab-label">20以内</span>
      </button>
      <button class="mode-tab" data-level="3">
        <span class="tab-icon"><span class="iconify" data-icon="fluent-emoji:hundred-points"></span></span>
        <span class="tab-label">100以内</span>
      </button>
    </div>

    <div class="content">
      <div class="question-display-bar">
        <div id="questionDisplay" class="question-display"></div>
        <button type="button" id="questionSpeaker" class="question-speaker" hidden aria-label="播放题目语音">🔊</button>
      </div>
      <div id="visualArea" class="visual-area"></div>
      <div id="controlArea" class="control-area"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div id="bottomActions" class="bottom-actions" style="display:none;">
      <button class="btn btn-green btn-lg" id="actionBtn">开始练习</button>
    </div>
  </div>

  <script src="js/timer.js?v=20260827_font_upright"></script>
  <script src="js/practice-support.js?v=20260827_font_upright"></script>
  <script src="js/math.js?v=20260827_font_upright"></script>
</body>
</html>
