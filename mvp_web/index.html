<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>玩中学数学</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css?v=20261120_8modules">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <style>
    #app {
      background: #F2FAF5 url('assets/math-bg.jpg') center bottom / cover no-repeat;
    }
    .home-header {
      position: relative;
      text-align: center;
      padding: 24px 20px 12px;
      flex-shrink: 0;
    }
    .settings-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #F1F5F9;
      border: 1.5px solid #CBD5E1;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .settings-btn:hover {
      background: #E2E8F0;
      transform: scale(1.05);
    }
    .settings-btn:active {
      transform: scale(0.95);
    }
    .home-title {
      font-family: 'ZCOOL KuaiLe', 'YouYuan', 'PingFang SC', 'Nunito', sans-serif;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1.2;
      padding: 6px 0;
    }
    .title-char {
      display: inline-block;
      font-weight: 900;
      -webkit-text-stroke: 1.5px currentColor;
      text-shadow:
        -2.5px -2.5px 0 #FFFFFF,
         2.5px -2.5px 0 #FFFFFF,
        -2.5px  2.5px 0 #FFFFFF,
         2.5px  2.5px 0 #FFFFFF,
         0 4px 0 rgba(0, 0, 0, 0.12);
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.08));
      transition: transform 0.2s ease;
    }
    .title-char-1 { color: #34B368; transform: rotate(-5deg) translateY(1px); }
    .title-char-2 { color: #38A3F1; transform: rotate(4deg) translateY(-2px); }
    .title-char-3 { color: #F59E0B; transform: rotate(-4deg) translateY(2px); }
    .title-char-4 { color: #EC6B7E; transform: rotate(4deg) translateY(-1px); }
    .title-char-5 { color: #9B6BE8; transform: rotate(-3deg) translateY(2px); }
    @media (max-width: 600px) {
      .home-title {
        font-size: 38px;
        letter-spacing: 2px;
        gap: 4px;
      }
      .title-char {
        -webkit-text-stroke: 1px currentColor;
        text-shadow:
          -2px -2px 0 #FFFFFF,
           2px -2px 0 #FFFFFF,
          -2px  2px 0 #FFFFFF,
           2px  2px 0 #FFFFFF,
           0 3px 0 rgba(0, 0, 0, 0.12);
      }
    }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      padding: 16px 24px 28px;
      flex: 1;
      overflow: auto;
      align-content: start;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
    }
    .module-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      padding: 18px 20px;
      border-radius: 22px !important;
      text-decoration: none;
      transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.1s ease;
      position: relative;
      box-sizing: border-box;
      cursor: pointer;
    }

    .module-card:hover {
      transform: translateY(-2px);
    }

    .module-card:active {
      transform: translateY(5px) !important;
    }

    /* 8大模块柔和淡彩背景 + 彩色 3D 实体底座（色彩丰富、舒缓不刺眼） */
    .card-baisu {
      background: #F2FAF4 !important;
      border: 2px solid #C8E6C9 !important;
      box-shadow: 0 5px 0 #A5D6A7 !important;
    }
    .card-baisu:active { box-shadow: 0 0 0 #A5D6A7 !important; }

    .card-shape {
      background: #FAECF8 !important;
      border: 2px solid #E1BEE7 !important;
      box-shadow: 0 5px 0 #CE93D8 !important;
    }
    .card-shape:active { box-shadow: 0 0 0 #CE93D8 !important; }

    .card-measure {
      background: #F0F8FF !important;
      border: 2px solid #B3E5FC !important;
      box-shadow: 0 5px 0 #81D4FA !important;
    }
    .card-measure:active { box-shadow: 0 0 0 #81D4FA !important; }

    .card-math {
      background: #FDF1F1 !important;
      border: 2px solid #FFCDD2 !important;
      box-shadow: 0 5px 0 #EF9A9A !important;
    }
    .card-math:active { box-shadow: 0 0 0 #EF9A9A !important; }

    .card-sudoku {
      background: #FFFDF0 !important;
      border: 2px solid #FFE082 !important;
      box-shadow: 0 5px 0 #FFD54F !important;
    }
    .card-sudoku:active { box-shadow: 0 0 0 #FFD54F !important; }

    .card-multiplication {
      background: #FFF7ED !important;
      border: 2px solid #FED7AA !important;
      box-shadow: 0 5px 0 #FDBA74 !important;
    }
    .card-multiplication:active { box-shadow: 0 0 0 #FDBA74 !important; }

    .card-game24 {
      background: #F0FDFA !important;
      border: 2px solid #CCFBF1 !important;
      box-shadow: 0 5px 0 #5EEAD4 !important;
    }
    .card-game24:active { box-shadow: 0 0 0 #5EEAD4 !important; }

    .card-story {
      background: #F5F3FF !important;
      border: 2px solid #DDD6FE !important;
      box-shadow: 0 5px 0 #C4B5FD !important;
    }
    .card-story:active { box-shadow: 0 0 0 #C4B5FD !important; }

    /* 卡片内部纯白通透图标徽章 */
    .module-card .module-icon-badge {
      width: 50px;
      height: 50px;
      border-radius: 16px !important;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .module-card .module-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .module-card .module-name {
      font-size: 18px;
      font-weight: 900;
      color: #1E293B;
      line-height: 1.25;
      text-align: left;
    }
    .module-card .module-desc {
      font-size: 12px;
      color: #64748B;
      text-align: left;
      line-height: 1.3;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    @media (max-width: 900px) {
      .module-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        padding: 12px 16px;
      }
      .module-card {
        padding: 16px;
        gap: 12px;
      }
      .module-card .module-icon-badge {
        width: 46px;
        height: 46px;
      }
      .module-card .module-name {
        font-size: 17px;
      }
      .module-card .module-desc {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="home-header">
      <button class="settings-btn" onclick="openSettings()">⚙️</button>
      <div class="home-title" aria-label="玩中学数学">
        <span class="title-char title-char-1">玩</span>
        <span class="title-char title-char-2">中</span>
        <span class="title-char title-char-3">学</span>
        <span class="title-char title-char-4">数</span>
        <span class="title-char title-char-5">学</span>
      </div>
    </div>

    <div class="module-grid">
      <a href="baisu.html" class="module-card card-baisu">
        <div class="module-icon-badge">
          <span class="iconify" data-icon="fluent-emoji:input-numbers" style="font-size: 32px;"></span>
        </div>
        <div class="module-info">
          <span class="module-name">百数板</span>
          <span class="module-desc">认数字 · 找邻居 · 九宫格</span>
        </div>
      </a>

      <a href="shape.html" class="module-card card-shape">
        <div class="module-icon-badge">
          <span class="iconify" data-icon="fluent-emoji:triangular-ruler" style="font-size: 32px;"></span>
        </div>
        <div class="module-info">
          <span class="module-name">图形与几何</span>
          <span class="module-desc">辨认 · 听指令</span>
        </div>
      </a>

      <a href="measure.html" class="module-card card-measure">
        <div class="module-icon-badge">
          <span class="iconify" data-icon="fluent-emoji:alarm-clock" style="font-size: 32px;"></span>
        </div>
        <div class="module-info">
          <span class="module-name">常见的量</span>
          <span class="module-desc">钟表 · 测量 · 日历</span>
        </div>
      </a>

      <a href="math.html" class="module-card card-math">
        <div class="module-icon-badge">
          <span class="iconify" data-icon="fluent-emoji:abacus" style="font-size: 32px;"></span>
        </div>
        <div class="module-info">
          <span class="module-name">加减法</span>
          <span class="module-desc">10以内 · 20以内 · 100以内</span>
        </div>
      </a>

      <a href="sudoku.html" class="module-card card-sudoku">
        <div class="module-icon-badge">
          <span class="iconify" data-icon="fluent-emoji:puzzle-piece" style="font-size: 32px;"></span>
        </div>
        <div class="module-info">
          <span class="module-name">数独</span>
          <span class="module-desc">4乘4 · 6乘6 · 9乘9</span>
        </div>
      </a>

      <a href="multiplication.html" class="module-card card-multiplication">
        <div class="module-icon-badge">
          <span class="iconify" data-icon="fluent-emoji:multiply" style="font-size: 32px;"></span>
        </div>
        <div class="module-info">
          <span class="module-name">乘除法启蒙</span>
          <span class="module-desc">乘法点阵 · 平均分 · 余数</span>
        </div>
      </a>

      <a href="game24.html" class="module-card card-game24">
        <div class="module-icon-badge">
          <span class="iconify" data-icon="fluent-emoji:flower-playing-cards" style="font-size: 32px;"></span>
        </div>
        <div class="module-info">
          <span class="module-name">24点与心算</span>
          <span class="module-desc">24点扑克 · 心算迷宫</span>
        </div>
      </a>

      <a href="story.html" class="module-card card-story">
        <div class="module-icon-badge">
          <span class="iconify" data-icon="fluent-emoji:open-book" style="font-size: 32px;"></span>
        </div>
        <div class="module-info">
          <span class="module-name">故事应用题</span>
          <span class="module-desc">求一共 · 比多比少 · 生活决策</span>
        </div>
      </a>
    </div>
  </div>

  <script src="js/timer.js?v=20261120_8modules"></script>
  <script>
    function openSettings() {
      window.location.href = 'settings.html';
    }
  </script>
</body>
</html>
