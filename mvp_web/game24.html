<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>数学真好玩 · 计算大闯关</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css?v=20261123_calc_overhaul">
  <link rel="stylesheet" href="css/game24.css?v=20261123_calc_overhaul">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body>
  <!-- 护眼背景装饰 -->
  <div class="bg-decoration">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <div id="app">
    <!-- 顶栏 -->
    <div class="topbar">
      <div class="topbar-left">
        <a href="index.html" class="back-btn" aria-label="返回首页"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
        <span class="topbar-title">⚡ 计算大闯关</span>
      </div>
      <div class="topbar-right">
        <span id="levelBadge" class="level-indicator-pill">第 1 关 · 5以内</span>
      </div>
    </div>

    <!-- 4 大模式切换页签 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="calc_rush">
        <span class="tab-icon">🎯</span>
        <span class="tab-label">计算闯关</span>
      </button>
      <button class="mode-tab" data-mode="blank_box">
        <span class="tab-icon">🔲</span>
        <span class="tab-label">方框填空</span>
      </button>
      <button class="mode-tab" data-mode="mixed_calc">
        <span class="tab-icon">⚡</span>
        <span class="tab-label">混合运算</span>
      </button>
      <button class="mode-tab" data-mode="cards24">
        <span class="tab-icon">🎴</span>
        <span class="tab-label">24点益智</span>
      </button>
    </div>

    <!-- 1~10 关卡选择器横条 (计算模式下显示) -->
    <div id="levelSelectorRow" class="level-selector-row">
      <div class="level-tabs-scroll" id="levelTabsScroll">
        <!-- JS 动态生成 1~10 关卡选择按钮 -->
      </div>
    </div>

    <!-- 关内5题进度条 -->
    <div id="calcProgressTrack" class="progress-track" style="max-width: 760px; margin: 4px auto 8px;">
      <div id="calcProgressFill" class="progress-fill" style="width: 20%;"></div>
    </div>

    <!-- 内容区 -->
    <div class="content game24-content">
      <!-- 题目提示栏 -->
      <div id="questionBar" class="question-bar">
        <span class="question-icon" id="questionIcon">🎯</span>
        <span class="question-text" id="questionText">算一算，得出正确答案吧！</span>
        <button type="button" id="questionSpeaker" class="question-speaker" aria-label="播放题目语音">🔊</button>
      </div>

      <!-- 画布舞台区 (算式/扑克牌) -->
      <div class="game24-stage" id="game24Stage">
        <!-- JS 动态生成算式卡或扑克牌 -->
      </div>

      <!-- 选项按钮区 -->
      <div class="game24-options" id="game24Options">
        <!-- JS 动态生成选项按钮 -->
      </div>
    </div>

    <!-- 反馈浮层 -->
    <div id="feedbackOverlay" class="feedback-overlay" style="display:none;">
      <div class="feedback-emoji" id="feedbackEmoji"></div>
      <div class="feedback-text" id="feedbackText"></div>
    </div>

    <!-- 关卡完成结算弹窗 -->
    <div id="levelClearModal" class="summary-modal" style="display:none;">
      <div class="summary-card">
        <div class="summary-trophy">⭐</div>
        <h2 class="summary-title" id="clearTitle">第 1 关 闯关成功！</h2>
        <p class="summary-subtitle" id="clearSubtitle">太棒啦，连续答对 5 题！</p>
        <div class="summary-stats">
          <div class="stat-box">
            <span class="stat-num" id="clearScore">5/5</span>
            <span class="stat-label">通关成绩</span>
          </div>
          <div class="stat-box">
            <span class="stat-num">⭐⭐⭐</span>
            <span class="stat-label">星级评价</span>
          </div>
        </div>
        <div class="summary-actions">
          <button id="btnNextLevel" class="btn-action btn-primary">下一关 ⏭️</button>
          <button id="btnReplayLevel" class="btn-action btn-secondary">🔄 再练一次</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/timer.js?v=20261123_calc_overhaul"></script>
  <script src="js/practice-support.js?v=20261123_calc_overhaul"></script>
  <script src="js/game24.js?v=20261123_calc_overhaul"></script>
</body>
</html>
