<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>数学真好玩 · 乘除法启蒙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css?v=20261124_mult_v3">
  <link rel="stylesheet" href="css/multiplication.css?v=20261124_mult_v3">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body>
  <!-- 护眼柔和背景装饰 -->
  <div class="bg-decoration">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <div id="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <a href="index.html" class="back-btn" aria-label="返回首页"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
        <span class="topbar-title">✖️ 乘除法启蒙</span>
      </div>
    </header>

    <!-- 1. 模式导航：4段式一体化浅灰分段条（Segmented Pill） -->
    <nav class="segmented-nav" aria-label="模式导航">
      <div class="segmented-control">
        <button class="segmented-item active" data-mode="table">📜 乘法表</button>
        <button class="segmented-item" data-mode="matrix">✖️ 点阵图</button>
        <button class="segmented-item" data-mode="share">⚖️ 平均分</button>
        <button class="segmented-item" data-mode="remainder">🍎 余数除法</button>
      </div>
    </nav>

    <!-- 内容主区域 -->
    <main class="content multiplication-content">
      <!-- 轻量题目提示条（无多余厚底座，清晰易读） -->
      <div class="stage-prompt-bar">
        <span class="stage-prompt-icon" id="questionIcon">📜</span>
        <span class="stage-prompt-text" id="questionText">点击数字切换口诀，点击卡片即可跟读</span>
        <button type="button" id="questionSpeaker" class="speaker-pill-btn" aria-label="朗读题目">🔊</button>
      </div>

      <!-- 核心教学画板（乘法口诀 / 行列直标点阵 / 规整均分 / 防溢出余数盘） -->
      <div class="clean-mult-stage" id="multStage">
        <!-- JS 动态生成口诀表、点阵或平分容器 -->
      </div>

      <!-- 选项按钮区（练习模式显示4大选项；乘法表模式显示背诵操作栏） -->
      <div class="mult-options" id="multOptions">
        <!-- JS 动态生成选项或操作按钮 -->
      </div>
    </main>

    <!-- 反馈浮层 -->
    <div id="feedbackOverlay" class="feedback-overlay" style="display:none;">
      <div class="feedback-emoji" id="feedbackEmoji"></div>
      <div class="feedback-text" id="feedbackText"></div>
    </div>
  </div>

  <script src="js/timer.js?v=20261124_mult_v3"></script>
  <script src="js/practice-support.js?v=20261124_mult_v3"></script>
  <script src="js/multiplication.js?v=20261124_mult_v3"></script>
</body>
</html>
