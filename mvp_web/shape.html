<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>数学启蒙 · 图形与几何</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css?v=20260827_fix_tangram_area_display_override">
  <link rel="stylesheet" href="css/shape.css?v=20261119_confetti_fix">
</head>
<body>
  <!-- 护眼背景装饰 -->
  <div class="bg-decoration">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <div id="app">
    <!-- 顶栏 -->
    <div class="topbar">
      <div class="topbar-left">
        <a href="index.html" class="back-btn" aria-label="返回首页"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
        <span class="topbar-title">📐 图形与几何</span>
      </div>
      <!-- Removed gamification elements -->
    </div>

    <!-- 模式切换标签 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="recognize">
        <span class="tab-icon">👀</span>
        <span class="tab-label">辨认</span>
      </button>
      <!-- 方位置物格模式 -->
      <button class="mode-tab" data-mode="spatial">
        <span class="tab-icon">🧭</span>
        <span class="tab-label">听指令</span>
      </button>
    </div>

    <!-- 辨认子标签：平面图形 / 立体图形 -->
    <div id="shapeSubTabs" class="shape-sub-tabs">
      <button class="shape-sub-tab active" data-subtype="plane">📄 平面图形</button>
      <button class="shape-sub-tab" data-subtype="solid">🧊 立体图形</button>
    </div>

    <!-- 内容区 -->
    <div class="content shape-content">

      <!-- 提示/题目区 -->
      <div id="questionBar" class="question-bar" style="display:none;">
        <span class="question-icon" id="questionIcon">🎯</span>
        <span class="question-text" id="questionText"></span>
        <button type="button" id="questionSpeaker" class="question-speaker" hidden aria-label="播放题目语音">🔊</button>
      </div>

      <!-- 辨认模式：图形展示区 -->
      <div id="recognizeArea" class="recognize-area">
        <!-- JS动态生成图形 -->
      </div>

      <!-- 方位置物格模式 (4x4) -->
      <div id="spatialArea" class="spatial-area" style="display:none;">
        <div class="shelf-wrapper">
          <div class="shelf-header-corner"></div>
          <div class="shelf-col-labels">
            <span class="shelf-label">第1列</span>
            <span class="shelf-label">第2列</span>
            <span class="shelf-label">第3列</span>
            <span class="shelf-label">第4列</span>
          </div>
          <div class="shelf-row-labels">
            <span class="shelf-label">第1行</span>
            <span class="shelf-label">第2行</span>
            <span class="shelf-label">第3行</span>
            <span class="shelf-label">第4行</span>
          </div>
          <div class="spatial-shelf" id="spatialShelf">
            <!-- JS动态生成4x4置物架槽位 -->
          </div>
        </div>
        <div class="spatial-tray" id="spatialTray">
          <!-- JS动态生成可以被拖拽的物品 -->
        </div>
      </div>

    </div>

    <!-- 底部操作区 -->
    <div id="bottomActions" class="bottom-actions" style="display:none;">
      <button class="btn btn-green btn-lg" id="actionBtn">🎯 开始练习</button>
    </div>

    <!-- 反馈浮层 -->
    <div id="feedbackOverlay" class="feedback-overlay" style="display:none;">
      <div class="feedback-emoji" id="feedbackEmoji"></div>
      <div class="feedback-text" id="feedbackText"></div>
    </div>

    <!-- 庆祝彩纸屑容器 -->
    <div id="confettiContainer" class="confetti-container"></div>
  </div>

  <script src="js/timer.js?v=20260314b"></script>
  <script src="js/practice-support.js?v=20260314b"></script>
  <script src="js/shape.js?v=20261119_confetti_fix"></script>
</body>
</html>
